services:
  app:
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    # Untuk deploy image hasil CI (bukan build lokal), ganti blok build di atas
    image: dkr-reg.serenetia.com/dellzevz/project-akhir-wp-ii:latest
    container_name: pawp2_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: ${APP_NAME:-BarberFlow}
      APP_ENV: ${APP_ENV:-production}
      # APP_KEY di-set eksplisit agar konsisten antar restart/redeploy. Untuk
      # produksi nyata, override lewat environment variable platform deploy.
      APP_KEY: ${APP_KEY:-base64:AMGr55gxQLgfvGdu5mulNDJysOE3fNLv0HVdUE9cQsA=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}

      # ==== MySQL EKSTERNAL — WAJIB diisi (tidak ada default host) ====
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Default driver = database (aman tanpa redis). Untuk memakai Redis
      # eksternal, override jadi "redis" di env platform lalu isi REDIS_* di bawah.
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

      # Redis eksternal (dipakai hanya jika driver di atas di-set "redis").
      REDIS_CLIENT: phpredis
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      # Index database Redis terpisah (bukan 0) agar tidak bentrok dengan app
      # lain yang berbagi instance Redis eksternal yang sama.
      # default (session/queue) -> REDIS_DB, cache -> REDIS_CACHE_DB.
      REDIS_DB: ${REDIS_DB:-1}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-2}

      RAJAONGKIR_API_KEY: ${RAJAONGKIR_API_KEY}
      RAJAONGKIR_BASE_URL: ${RAJAONGKIR_BASE_URL:-https://rajaongkir.komerce.id/api/v1}
      RAJAONGKIR_ORIGIN: ${RAJAONGKIR_ORIGIN}

      # Google OAuth untuk login customer. Kalau GOOGLE_REDIRECT_URL kosong,
      # Socialite tidak mengirim redirect_uri -> Google menolak dengan
      # "Missing required parameter: redirect_uri".
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
    volumes:
      # Persist file yang diunggah (gambar). Pada pembuatan pertama, volume ini
      # otomatis diisi dari isi folder storage di image (termasuk gambar seed).
      - storage_data:/var/www/html/storage

volumes:
  storage_data:
