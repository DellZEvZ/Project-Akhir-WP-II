services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawp2_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: ${APP_NAME:-BarberFlow}
      APP_ENV: ${APP_ENV:-production}
      # APP_KEY di-set eksplisit agar konsisten antar restart/redeploy (kalau
      # dibiarkan kosong, entrypoint akan generate key baru setiap container
      # fresh sehingga session & data terenkripsi rusak). Untuk produksi nyata,
      # override lewat environment variable platform deploy.
      APP_KEY: ${APP_KEY:-base64:AMGr55gxQLgfvGdu5mulNDJysOE3fNLv0HVdUE9cQsA=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-db_projectakhir}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

      MAIL_MAILER: ${MAIL_MAILER:-log}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pawp2_network

  db:
    image: mysql:8.0
    container_name: pawp2_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_projectakhir}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database_backup.sql:/docker-entrypoint-initdb.d/database_backup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pawp2_network

  redis:
    image: redis:7-alpine
    container_name: pawp2_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pawp2_network

volumes:
  db_data:
  redis_data:
  storage_data:

networks:
  pawp2_network:
    driver: bridge
